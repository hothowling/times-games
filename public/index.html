<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<!-- 사진 캐릭터의 얼굴 찾기(MediaPipe)가 보내는 사용 통계와 다른 서버로의 전송을 막습니다. -->
<meta http-equiv="Content-Security-Policy" content="connect-src 'self'">
<title>똑똑 놀이터</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/ui/sparkle.webp">
<!-- 홈 화면에 추가(iOS): 아이콘, 이름, 주소창 없이 열기 -->
<link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="똑똑 놀이터">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="core/ui.css">
<link rel="stylesheet" href="core/icons.css">
<link rel="stylesheet" href="core/character.css">
<link rel="stylesheet" href="core/install.css">
</head>
<body>
<header id="topbar" class="topbar" hidden>
  <button type="button" id="tb-me" class="tb-me">
    <span id="tb-face" class="tb-face"></span>
    <span id="tb-name" class="tb-name"></span>
  </button>
  <span class="tb-sparkles"><span class="ui-icon" data-icon="sparkle" aria-hidden="true" style="--icon-size:22px"></span><b id="tb-sparkles">0</b></span>
  <button type="button" id="tb-settings" class="icon-btn" data-i18n-aria="settings"><span class="ui-icon" data-icon="settings" aria-hidden="true"></span></button>
</header>

<main id="view"></main>

<dialog id="settings" class="sheet">
  <form method="dialog" class="sheet-card">
    <h2 data-i18n="settings"></h2>
    <label class="toggle"><span data-i18n="sound"></span><input type="checkbox" id="set-sound"></label>
    <label class="toggle"><span data-i18n="voice"></span><input type="checkbox" id="set-tts"></label>
    <label class="toggle"><span data-i18n="rankHide"></span><input type="checkbox" id="set-rank-hidden"></label>
    <button type="button" id="set-lang" class="btn btn-sub" data-i18n="language"></button>
    <button type="button" id="set-account" class="btn" data-i18n="guestMake" hidden></button>
    <button type="button" id="set-install" class="btn btn-sub" data-i18n="installMenu" hidden></button>
    <button type="button" id="set-logout" class="btn btn-sub" data-i18n="logout"></button>
    <button class="btn" data-i18n="close"></button>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="core/app.js"></script>
</body>
</html>
