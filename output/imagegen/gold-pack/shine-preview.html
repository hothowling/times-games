<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gold Pack · 반사광 미리보기</title><style>/*
 * character.css - core/character.js 의 캐릭터 스타일.
 * 층마다 한 가지 움직임만 맡겨 서로 덮어쓰지 않게 했습니다(transform/opacity 만 사용).
 *   .chr-sway 좌우 기우뚱 · .chr-breathe 숨쉬기 · .chr-act 반응 동작 · .chr-glow 발밑 그림자 · .chr-sparkles 반짝이
 * 크기는 .chr 요소의 width 로 정합니다. 높이는 비율(--chr-ratio)로 따라옵니다.
 * 원본: times-table-game 마스코트 CSS + times-class 착용 레이어
 */

.chr {
  --chr-w: 180px;
  --chr-glow: rgb(124 58 237 / 32%);
  position: relative;
  display: block; /* 크기는 부르는 쪽이 width 로 정합니다(기본: 부모 너비) */
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.chr-stage {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: var(--chr-ratio, 250 / 275);
}

.chr-sway,
.chr-breathe,
.chr-act {
  position: absolute;
  inset: 0;
  display: block;
  transform-origin: 50% 100%;
}

.chr-sway { animation: chr-sway 4000ms ease-in-out infinite; }
.chr-breathe { animation: chr-breathe 3000ms ease-in-out infinite; }

/* 기준 상자(250×275, 얼굴만이면 얼굴 칸 크기). character.js 가 scale 로 요소 너비에 맞춥니다. */
.chr-rig {
  position: absolute;
  left: 0;
  top: 0;
  width: 250px;
  height: 275px;
  transform-origin: 0 0;
}

.chr-face {
  position: absolute;
  z-index: 3;
  top: var(--face-y);
  left: var(--face-x);
  width: var(--face-w);
  height: var(--face-h);
  transform: translateX(-50%);
  background-repeat: no-repeat;
  background-size: 500% auto;
  background-position: 0% center;
  /* 옆 칸 표정이 칸 경계에 얇게 비치지 않도록 양옆을 조금 자릅니다(소수점 배율에서 생기는 번짐). */
  clip-path: inset(0 1.5%);
  filter: drop-shadow(0 5px 4px rgb(29 60 78 / 13%));
}

.chr-w {
  position: absolute;
  display: block;
  object-fit: contain;
  filter: drop-shadow(0 5px 4px rgb(29 45 62 / 18%));
}

.chr-w[hidden] { display: none; }

.chr-head {
  z-index: 6;
  top: var(--head-y);
  left: var(--head-x);
  width: var(--head-w);
  height: var(--head-w);
  transform: translateX(-50%) rotate(var(--head-angle));
}

.chr-glasses {
  z-index: 6;
  top: var(--glasses-y);
  left: var(--glasses-x);
  width: var(--glasses-w);
  height: calc(var(--glasses-w) / 2);
  transform: translateX(-50%) rotate(var(--glasses-angle));
}

/* 금속 표면 위를 지나가는 반사광과 서로 다른 시점에 빛나는 작은 별. */
.wearable-shine {
  --shine-period: 5.4s;
  --shine-delay: 0s;
  --glint-a-x: 50%;
  --glint-a-y: 35%;
  --glint-b-x: 72%;
  --glint-b-y: 74%;
  position: absolute;
  display: block;
  pointer-events: none;
  filter: none;
}
.wearable-shine[hidden] { display: none; }
.wearable-shine[data-shine='glasses'] {
  --shine-delay: -2.2s;
  --glint-a-x: 24%;
  --glint-a-y: 25%;
  --glint-b-x: 79%;
  --glint-b-y: 73%;
}
.wearable-sheen {
  position: absolute;
  inset: 0;
  overflow: hidden;
  -webkit-mask: var(--shine-image) center / contain no-repeat;
  mask: var(--shine-image) center / contain no-repeat;
}
.wearable-sheen::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(115deg, transparent 32%, rgb(255 247 208 / 25%) 40%, #fffdf3 48%, rgb(255 255 255 / 85%) 51%, rgb(255 247 208 / 25%) 59%, transparent 67%);
  animation: wearable-sweep var(--shine-period) ease-in-out var(--shine-delay) infinite;
}
.wearable-glint {
  position: absolute;
  width: 8%;
  aspect-ratio: 1;
  left: var(--glint-a-x);
  top: var(--glint-a-y);
  opacity: 0;
  background: #fffdf1;
  clip-path: polygon(50% 0, 60% 39%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 39%);
  animation: wearable-glint var(--shine-period) ease-in-out var(--shine-delay) infinite;
}
.wearable-glint-b {
  left: var(--glint-b-x);
  top: var(--glint-b-y);
  animation-delay: calc(var(--shine-delay) - 2.7s);
  width: 6%;
}
.wearable-icon { position: relative; display: block; width: 64px; height: 64px; }
.wearable-icon > img { display: block; width: 100%; height: 100%; object-fit: contain; }
.wearable-icon > .wearable-shine { inset: 0; }
.wearable-icon > .wearable-shine[data-shine='glasses'] { top: 25%; bottom: 25%; }
.shop-pack-images > .wearable-icon { width: 62px; height: 62px; }
@keyframes wearable-sweep {
  0%, 5% { opacity: 0; transform: translateX(-110%); }
  8% { opacity: .9; }
  28% { opacity: .9; transform: translateX(110%); }
  30%, 100% { opacity: 0; transform: translateX(110%); }
}
@keyframes wearable-glint {
  0%, 13%, 31%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(.25) rotate(-20deg); }
  22% { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(0); }
}

.chr-mouth {
  z-index: 6;
  top: var(--mouth-y);
  left: var(--mouth-x);
  width: var(--mouth-w);
  height: var(--mouth-w);
  transform: translate(-50%, -50%);
}

.chr-back {
  z-index: 0;
  right: var(--back-right);
  bottom: var(--back-bottom);
  width: var(--back-w);
  height: var(--back-w);
  transform: rotate(6deg);
}

.chr-outfit {
  z-index: 1;
  left: 50%;
  bottom: var(--outfit-bottom);
  width: 250px;
  height: 250px;
  transform: translateX(-50%);
}

/*
 * 펫은 캐릭터 왼쪽, 흔드는 손 앞에 나란히 섭니다. 얼굴보다 앞(z-index 7 > 얼굴 3)에 그리고,
 * 아래쪽을 기준 상자 바닥(상체 아래)에 맞춥니다. 손은 옷 그림마다 기준 상자 x≈15~60 에 있습니다.
 */
.chr-pet {
  z-index: 7;
  left: var(--pet-x, 30px);
  bottom: var(--pet-bottom, -6px);
  width: var(--pet-w, 168px);
  height: var(--pet-w, 168px);
  transform: translateX(-50%);
  object-fit: contain;
}

.chr-glow {
  position: absolute;
  left: 14%;
  width: 72%;
  bottom: -5%;
  height: 12%;
  display: block;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, var(--chr-glow) 0%, transparent 70%);
  animation: chr-glow 3000ms ease-in-out infinite;
}

.chr-faceonly .chr-glow { display: none; }

@keyframes chr-sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes chr-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
@keyframes chr-glow { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.08); opacity: 1; } }

.chr.is-cheer .chr-act { animation: chr-nod 1200ms ease-in-out; }
@keyframes chr-nod {
  0%, 100% { transform: none; }
  20% { transform: translateY(-4px) rotate(2deg); }
  45% { transform: translateY(0) rotate(0); }
  65% { transform: translateY(-2px) rotate(-1deg); }
}

/* 정답: 쪼그렸다가 폴짝 */
.chr.is-correct .chr-act { animation: chr-jump 600ms ease-out; }
.chr.is-correct .chr-glow { animation: chr-glow-jump 600ms ease-out; }
@keyframes chr-jump {
  0% { transform: none; }
  15% { transform: translateY(0) scale(1.08, .9); }
  42% { transform: translateY(-10%) scale(.94, 1.08); }
  68% { transform: translateY(0) scale(1.07, .93); }
  84% { transform: translateY(-2%) scale(1); }
  100% { transform: none; }
}
@keyframes chr-glow-jump {
  0%, 100% { transform: scale(1); opacity: .85; }
  15% { transform: scale(1.12); opacity: 1; }
  42% { transform: scale(.6); opacity: .45; }
  68% { transform: scale(1.1); opacity: 1; }
}

/* 오답: 도리도리 */
.chr.is-wrong .chr-act { animation: chr-shake 300ms ease-in-out; }
@keyframes chr-shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-4%); }
  40% { transform: translateX(4%); }
  60% { transform: translateX(-3%); }
  80% { transform: translateX(2%); }
}

/* 시간 초과·실패: 고개를 떨굼 */
.chr.is-timeout .chr-act { animation: chr-droop 800ms ease-in-out; }
@keyframes chr-droop { 0%, 100% { transform: none; } 30%, 70% { transform: translateY(2%) rotate(-6deg); } }

/* 클리어: 크게 두 번 폴짝 */
.chr.is-clear .chr-act { animation: chr-bounce2 1100ms ease-out; }
.chr.is-clear .chr-glow { animation: chr-glow-bounce2 1100ms ease-out; }
@keyframes chr-bounce2 {
  0% { transform: none; }
  8% { transform: translateY(0) scale(1.1, .88); }
  25% { transform: translateY(-15%) scale(.93, 1.1); }
  42% { transform: translateY(0) scale(1.1, .9); }
  52% { transform: translateY(0) scale(1.04, .96); }
  70% { transform: translateY(-11%) scale(.95, 1.07); }
  86% { transform: translateY(0) scale(1.06, .94); }
  100% { transform: none; }
}
@keyframes chr-glow-bounce2 {
  0%, 100% { transform: scale(1); opacity: .85; }
  25% { transform: scale(.55); opacity: .4; }
  42% { transform: scale(1.12); opacity: 1; }
  70% { transform: scale(.65); opacity: .5; }
  86% { transform: scale(1.08); opacity: 1; }
}

/* 반짝이: 얼굴 가운데에서 바깥으로. 방향은 --sx/--sy */
.chr-sparkles { position: absolute; inset: 0; display: block; }
.chr-sparkles i {
  --spark: max(10px, calc(var(--chr-w) * .1));
  position: absolute;
  left: 50%;
  top: 35%;
  width: var(--spark);
  height: var(--spark);
  margin: calc(var(--spark) / -2) 0 0 calc(var(--spark) / -2);
  background: #a78bfa;
  clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);
  opacity: 0;
}
.chr-sparkles i:nth-child(3n+2) { background: #f472b6; }
.chr-sparkles i:nth-child(3n) { background: #facc15; }
.chr-sparkles i:nth-child(1) { --sx: 0; --sy: -1; }
.chr-sparkles i:nth-child(2) { --sx: .588; --sy: -.809; }
.chr-sparkles i:nth-child(3) { --sx: .951; --sy: -.309; }
.chr-sparkles i:nth-child(4) { --sx: .951; --sy: .309; }
.chr-sparkles i:nth-child(5) { --sx: .588; --sy: .809; }
.chr-sparkles i:nth-child(6) { --sx: 0; --sy: 1; }
.chr-sparkles i:nth-child(7) { --sx: -.588; --sy: .809; }
.chr-sparkles i:nth-child(8) { --sx: -.951; --sy: .309; }
.chr-sparkles i:nth-child(9) { --sx: -.951; --sy: -.309; }
.chr-sparkles i:nth-child(10) { --sx: -.588; --sy: -.809; }

.chr.is-correct .chr-sparkles i { --sr: .62; animation: chr-spark 600ms ease-out; }
.chr.is-clear .chr-sparkles i { --sr: .85; --spark: max(12px, calc(var(--chr-w) * .13)); animation: chr-spark 900ms ease-out 2; }
.chr.is-clear .chr-sparkles i:nth-child(even) { animation-delay: 150ms; }
@keyframes chr-spark {
  0% { opacity: 0; transform: translate(0, 0) scale(.2) rotate(0deg); }
  35% {
    opacity: 1;
    transform: translate(calc(var(--chr-w) * var(--sx) * var(--sr) * .7), calc(var(--chr-w) * var(--sy) * var(--sr) * .7)) scale(1.1) rotate(45deg);
  }
  100% {
    opacity: 0;
    transform: translate(calc(var(--chr-w) * var(--sx) * var(--sr)), calc(var(--chr-w) * var(--sy) * var(--sr))) scale(.4) rotate(90deg);
  }
}

/* 동작 줄이기: 표정만 바뀝니다. */
@media (prefers-reduced-motion: reduce) {
  .chr-sway, .chr-breathe, .chr-act, .chr-glow,
  .chr.is-cheer .chr-act, .chr.is-correct .chr-act, .chr.is-correct .chr-glow,
  .chr.is-wrong .chr-act, .chr.is-timeout .chr-act, .chr.is-clear .chr-act, .chr.is-clear .chr-glow {
    animation: none !important;
  }
  .chr-sparkles { display: none; }
  .wearable-sheen::before, .wearable-glint { animation: none; }
  .wearable-sheen::before { opacity: .2; transform: none; }
  .wearable-glint { opacity: .6; transform: translate(-50%, -50%) scale(.7); }
}
