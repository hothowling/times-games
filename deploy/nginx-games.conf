# /etc/nginx/sites-available/ics.jotanow.site.conf 의 server(443) 블록 안, "location / {" 앞에 넣습니다.
    # 루트(포트 8000)가 ~/dev/jotanow 를 통째로 서빙하므로 새 게임 소스·개발용 data/ 는 막습니다.
    location ^~ /times-games/ {
        return 404;
    }

    location = /games {
        return 301 /games/;
    }

    location /games/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 사진 캐릭터 업로드(최대 3MB, Safari 는 PNG)
        client_max_body_size 4m;
        # MediaPipe WASM(11MB)·JS·CSS 를 압축해 보냅니다
        gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;
    }
