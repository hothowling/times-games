<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영단어 그림 검수</title>
<!--
  영단어 짝맞추기 그림 검수 페이지. 파일로 바로 엽니다(open scripts/wordmatch-review.html).
  데이터는 scripts/fetch-word-images.mjs 가 아래 WM_DATA 자리에 채웁니다(그림은 ../public/assets/games/wordmatch/img/).
  이상한 그림에 '보류'를 체크 → 아래 명령을 복사 → 터미널에서 실행하면 다음 후보로 다시 받습니다.
-->
<style>
  :root { --bg: #f6f7fb; --card: #fff; --ink: #1d2233; --sub: #6b7285; --line: #e2e5ef; --bad: #ffe1e1; --accent: #3a5bd9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161d; --card: #1e212b; --ink: #e8eaf2; --sub: #9aa0b4; --line: #2d3140; --bad: #4a2427; --accent: #8aa2ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
    margin: -16px -16px 16px; padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 18px; }
  select, button, label.f { font: inherit; }
  button { padding: 6px 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  #out { flex-basis: 100%; width: 100%; min-height: 2.4em; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--ink); font: 12px ui-monospace, monospace; resize: vertical; }
  .stat { color: var(--sub); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .card { display: flex; flex-direction: column; gap: 4px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .card.hold { background: var(--bad); }
  .pic { aspect-ratio: 1; border-radius: 8px; overflow: hidden; display: grid; place-items: center; background: var(--line); font-size: 56px; }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .en { font-weight: 700; font-size: 16px; }
  .ko { color: var(--sub); }
  .meta { color: var(--sub); font-size: 11px; overflow-wrap: anywhere; }
  .meta a { color: var(--accent); }
  .hold-box { display: flex; gap: 6px; align-items: center; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>영단어 그림 검수</h1>
  <select id="topic"><option value="">전체 주제</option></select>
  <select id="show">
    <option value="all">전부</option>
    <option value="img">그림 있음</option>
    <option value="noimg">그림 없음</option>
    <option value="hold">보류만</option>
  </select>
  <span class="stat" id="stat"></span>
  <button id="copy" type="button">보류 목록 복사</button>
  <button id="clear" type="button">보류 모두 해제</button>
  <textarea id="out" readonly rows="2" placeholder="보류를 체크하면 다시 받기 명령이 여기 나옵니다"></textarea>
</header>
<main class="grid" id="grid"></main>

<script>
(() => {
  const { words, images } = window.WM_DATA;
  const IMG = '../public/assets/games/wordmatch/img/';
  const KEY = 'wordmatch-review-hold';
  let hold = new Set();
  try { hold = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...hold])); } catch {} };
  const $ = (s) => document.querySelector(s);

  const topics = [...new Set(words.map((w) => w.topic))];
  for (const t of topics) $('#topic').append(new Option(t, t));

  function render() {
    const topic = $('#topic').value;
    const show = $('#show').value;
    const list = words.filter((w) => (!topic || w.topic === topic) &&
      (show === 'all' || (show === 'img' && images[w.id]) || (show === 'noimg' && !images[w.id]) || (show === 'hold' && hold.has(w.id))));
    $('#grid').replaceChildren(...list.map((w) => {
      const c = images[w.id];
      const card = document.createElement('div');
      card.className = 'card' + (hold.has(w.id) ? ' hold' : '');
      const pic = document.createElement('div');
      pic.className = 'pic';
      if (c) {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.src = `${IMG}${w.id}.${c.ext}?v=${encodeURIComponent(c.url || '')}`;
        img.alt = w.en;
        img.onerror = () => { pic.textContent = w.emoji || '—'; };
        pic.append(img);
      } else pic.textContent = w.emoji || '—';
      const en = document.createElement('div'); en.className = 'en'; en.textContent = w.en;
      const ko = document.createElement('div'); ko.className = 'ko'; ko.textContent = `${w.ko} · ${w.topic} · ${w.id}`;
      const meta = document.createElement('div'); meta.className = 'meta';
      if (c) {
        const a = document.createElement('a');
        a.href = c.sourceUrl; a.target = '_blank'; a.rel = 'noopener'; a.textContent = c.title || '(제목 없음)';
        meta.append(a, ` — ${c.creator} · ${c.license} · ${c.source}`);
      } else meta.textContent = '그림 없음';
      const lab = document.createElement('label'); lab.className = 'hold-box';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = hold.has(w.id);
      cb.addEventListener('change', () => {
        if (cb.checked) hold.add(w.id); else hold.delete(w.id);
        card.classList.toggle('hold', cb.checked);
        save(); output();
      });
      lab.append(cb, '보류');
      card.append(pic, en, ko, meta, lab);
      return card;
    }));
    const n = Object.keys(images).length;
    $('#stat').textContent = `${list.length}개 표시 · 그림 ${n}/${words.length} · 보류 ${hold.size}`;
  }

  function output() {
    const ids = words.map((w) => w.id).filter((id) => hold.has(id));
    $('#out').value = ids.length
      ? `${JSON.stringify(ids)}\nnode scripts/fetch-word-images.mjs --skip=${ids.join(',')}`
      : '';
    $('#stat').textContent = $('#stat').textContent.replace(/보류 \d+/, `보류 ${hold.size}`);
  }

  $('#topic').addEventListener('change', render);
  $('#show').addEventListener('change', render);
  $('#copy').addEventListener('click', async () => {
    output();
    const text = $('#out').value;
    try { await navigator.clipboard.writeText(text); $('#copy').textContent = '복사됨!'; }
    catch { $('#out').select(); document.execCommand('copy'); $('#copy').textContent = '복사됨'; }
    setTimeout(() => { $('#copy').textContent = '보류 목록 복사'; }, 1500);
  });
  $('#clear').addEventListener('click', () => { hold.clear(); save(); render(); output(); });
  render();
  output();
})();
</script>
